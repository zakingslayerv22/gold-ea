<!DOCTYPE html>
<html lang="en" data-title-template="Frequently Asked Questions — {siteName}"
      data-description="The complete {siteName} FAQ: basics, account and broker questions, capital and risk, plus setup and support.">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Title and meta tags are rewritten from `siteName` in main.js; the
         patterns live on the <html> element above. -->
    <title>Frequently Asked Questions — GOLDTRAP EA</title>
    <meta name="description" content="">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="">
    <meta property="og:title" content="">
    <meta property="og:description" content="">
    <meta property="og:image" content="assets/images/logo-gb.svg">

    <!-- Twitter / social -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="">
    <meta name="twitter:description" content="">
    <meta name="twitter:image" content="assets/images/logo-gb.svg">

    <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/styles/styles.css">
</head>

<body>
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <div class="page-wrapper">

        <!-- Same version-based announcement bar as the homepage -->
        <div class="action-bar" id="announcement-bar" hidden>
            <div class="container action-bar__inner">
                <span class="action-bar__icon" aria-hidden="true">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>
                </span>

                <a class="action-bar__link" id="announcement-link" href="#"></a>

                <button type="button" class="action-bar__close" id="announcement-close"
                        aria-label="Dismiss announcement">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
        </div>

        <div class="hero">
            <header class="site-header">
                <div class="container site-header__inner">

                    <a class="brand" href="index.html">
                        <img class="brand__mark" src="assets/images/logo-gb.svg"
                             alt="" width="48" height="48">
                        <span class="brand__name" data-site-name>GOLDTRAP EA</span>
                    </a>

                    <!-- Inline at wide widths; the hamburger's panel below it. -->
                    <nav class="primary-nav" id="primary-nav" aria-label="Primary">
                        <ul class="primary-nav__list">
                            <li><a class="primary-nav__link" href="index.html#how-it-works">How It Trades</a></li>
                            <li><a class="primary-nav__link" href="index.html#benefits">Features</a></li>
                            <li><a class="primary-nav__link" href="index.html#pricing">Pricing</a></li>
                            <li><a class="primary-nav__link" href="index.html#downloads">Downloads</a></li>
                            <li><a class="primary-nav__link" href="index.html#faq">FAQ</a></li>
                        </ul>
                    </nav>

                    <!--
                        Header actions. The language control and the hamburger are
                        deliberately grouped so they stay side by side on mobile,
                        where horizontal space is scarce. The brand sits at the far
                        left and this group at the far right; the space between them
                        is what justify-content: space-between distributes.
                    -->
                    <div class="site-header__actions">

                        <!-- §5.3 Translation / language selector -->
                        <div class="lang-select" id="lang-select">
                            <button type="button" class="lang-select__toggle" id="lang-select-toggle"
                                    aria-expanded="false" aria-haspopup="listbox"
                                    aria-controls="lang-select-panel">
                                <!--
                                    Two labels, one visible at a time. Desktop and
                                    tablet show the full language name; mobile shows
                                    only the two-letter abbreviation of the CURRENT
                                    language. main.js keeps both in sync — neither is
                                    hard-coded.
                                -->
                                <span class="lang-select__name" id="lang-select-label">English</span>
                                <span class="lang-select__code" id="lang-select-code">EN</span>
                                <svg class="lang-select__chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
                            </button>

                            <div class="lang-select__panel" id="lang-select-panel" hidden>
                                <label class="visually-hidden" for="lang-select-search">Search languages</label>
                                <input type="search" class="lang-select__search" id="lang-select-search"
                                       placeholder="Search languages…" autocomplete="off">
                                <div class="lang-select__list" id="lang-select-list"
                                     role="listbox" aria-label="Languages"></div>
                            </div>
                        </div>

                        <!--
                            Hamburger. Hidden while the inline navigation still fits;
                            revealed below the nav breakpoint. Behaviour lives in
                            initMobileNavigation() in main.js.
                        -->
                        <button type="button" class="nav-toggle" id="nav-toggle"
                                aria-label="Open navigation menu" aria-expanded="false"
                                aria-controls="primary-nav">
                            <span class="nav-toggle__box" aria-hidden="true">
                                <span class="nav-toggle__bar"></span>
                                <span class="nav-toggle__bar"></span>
                                <span class="nav-toggle__bar"></span>
                            </span>
                        </button>

                    </div>

                </div>
            </header>

            <main id="main-content">
                <!--
                    The complete FAQ collection, generated from the same FAQ
                    service the homepage uses. data-faq-mode="all" renders every
                    category with no question limit.
                -->
                <section class="section section--zinc" id="faq" aria-labelledby="faq-title"
                         data-faq-mode="all">
                    <div class="container container--md section__inner faq__inner">
                        <p class="eyebrow scroll-reveal">FAQ</p>
                        <h1 class="section-heading section-heading--sm section-heading--center scroll-reveal" id="faq-title">
                            Frequently Asked Questions
                        </h1>
                        <p class="section-lead section-lead--center scroll-reveal">
                            <span data-site-name-in>Everything you need to know about
                            {siteName}.</span>
                        </p>

                        <div class="faq__categories" id="faq-categories" role="tablist"
                             aria-label="FAQ categories"></div>

                        <div id="faq-panels"></div>

                        <div class="faq__browse scroll-reveal">
                            <a class="btn btn--dark btn--lg" href="index.html">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                                Back to homepage
                            </a>
                        </div>
                    </div>
                </section>
            </main>

            <footer class="site-footer">
                <div class="container site-footer__inner">
                    <p id="footer-caveat" class="scroll-reveal"></p>

                    <p class="terms-notice scroll-reveal">
                        Using this site and/or any of its products puts you under its
                        <a id="terms-and-conditions-link" href="#">Terms and Conditions</a>
                    </p>

                    <a class="footer-telegram scroll-reveal" data-telegram="channel"
                       href="#" aria-label="Telegram" target="_blank" rel="noopener noreferrer">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                    </a>

                    <p class="site-footer__copyright scroll-reveal" id="footer-copyright"></p>
                </div>
            </footer>
        </div>
    </div>

    <a class="chat-widget" id="live-chat-launcher" data-telegram="personal" href="#"
       target="_blank" rel="noopener noreferrer">
        <span class="chat-widget__label" id="live-chat-label" aria-hidden="true"></span>
        <span class="chat-widget__avatar-wrap">
            <span class="chat-widget__pulse" aria-hidden="true"></span>
            <img class="chat-widget__avatar" src="assets/images/chat-avatar.png"
                 alt="" width="68" height="68">
            <span class="chat-widget__status" aria-hidden="true"></span>
        </span>
    </a>

    <!-- GTranslate Free mount point; kept hidden by the stylesheet. -->
    <div class="gtranslate_wrapper" aria-hidden="true"></div>

    <script type="module" src="assets/scripts/main.js"></script>
</body>
</html>
