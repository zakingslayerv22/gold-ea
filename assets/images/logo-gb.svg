  <!--
    The "GB" lettering, drawn as outlines rather than a <text> element.
    It is Montserrat Black (900), the same face .hero__title uses through
    the font-display custom property, laid out at the original font-size
    19 with the original negative 0.4 letter-spacing, then centred on the
    circle.

    Outlines rather than <text> because this file is loaded through an
    <img>, which renders it in an isolated document: the page's Google
    Fonts link does not reach inside, so a font-family of "Montserrat"
    here would silently fall back to a system sans. Outlines render the
    real face everywhere with no font dependency.
  -->
