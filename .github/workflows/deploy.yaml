name: Deploy to Namecheap

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  # =====================================================================
  #  SET THIS BASED ON WHICH FIX YOU APPLIED:
  #
  #  FIX A - recreated the FTP account with Directory = public_html
  #          (FTP user lands directly IN the web root)
  #      REMOTE_DIR: ./
  #
  #  FIX B - using cPanel main account credentials (goldnkum)
  #          (FTP user lands in /home/goldnkum)
  #      REMOTE_DIR: /public_html/
  #
  #  The "Diagnose" step below prints exactly where you land. Read it,
  #  then set this line to match.
  # =====================================================================
  REMOTE_DIR: ./

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Diagnose where this FTP user lands
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
            set ftp:ssl-allow yes;
            set ftp:ssl-force yes;
            set ftp:ssl-protect-data no;
            set ssl:verify-certificate no;
            set ftp:passive-mode yes;
            open -u \"\$FTP_USER\",\"\$FTP_PASS\" \"\$FTP_HOST\";
            echo '### LOGIN DIRECTORY = your FTP jail root ###';
            pwd;
            echo '### WHAT IS HERE ###';
            cls -l ./;
            echo '### WHERE FILES WILL ACTUALLY GO ###';
            cls -l ${{ env.REMOTE_DIR }} || echo 'TARGET DOES NOT EXIST YET';
            bye
          "

      - name: Deploy via FTPS
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
            set ftp:ssl-allow yes;
            set ftp:ssl-force yes;
            set ftp:ssl-protect-data no;
            set ftp:ssl-protect-list no;
            set ssl:verify-certificate no;
            set ftp:passive-mode yes;
            set ftp:use-allo no;
            set net:timeout 30;
            set net:max-retries 3;
            set net:reconnect-interval-base 5;
            open -u \"\$FTP_USER\",\"\$FTP_PASS\" \"\$FTP_HOST\";
            mirror --reverse --verbose --transfer-all --parallel=1 \
              --exclude-glob .git/ \
              --exclude-glob .git* \
              --exclude-glob .github/ \
              --exclude-glob node_modules/ \
              --exclude-glob mockups/ \
              --exclude-glob '*.md' \
              ./ ${{ env.REMOTE_DIR }};
            bye
          "

      - name: Verify sizes are NOT zero
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
            set ftp:ssl-allow yes;
            set ftp:ssl-force yes;
            set ftp:ssl-protect-data no;
            set ssl:verify-certificate no;
            set ftp:passive-mode yes;
            open -u \"\$FTP_USER\",\"\$FTP_PASS\" \"\$FTP_HOST\";
            echo '### DEPLOY TARGET ###';
            cls -l ${{ env.REMOTE_DIR }};
            echo '### assets/styles ###';
            cls -l ${{ env.REMOTE_DIR }}assets/styles/;
            echo '### assets/scripts ###';
            cls -l ${{ env.REMOTE_DIR }}assets/scripts/;
            bye
          "
