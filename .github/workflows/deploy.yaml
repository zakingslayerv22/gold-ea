name: Deploy to Namecheap

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  # ./          = FTP user is jailed directly inside public_html  (Fix A)
  # /public_html/ = FTP user lands in /home/goldnkum              (Fix B)
  REMOTE_DIR: ./

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Check secrets are actually set
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          fail=0
          [ -z "$FTP_HOST" ] && { echo "FTP_SERVER secret is EMPTY or misnamed"; fail=1; }
          [ -z "$FTP_USER" ] && { echo "FTP_USERNAME secret is EMPTY or misnamed"; fail=1; }
          [ -z "$FTP_PASS" ] && { echo "FTP_PASSWORD secret is EMPTY or misnamed"; fail=1; }
          echo "host length: ${#FTP_HOST} chars"
          echo "user length: ${#FTP_USER} chars"
          echo "pass length: ${#FTP_PASS} chars"
          echo "--- DNS resolution test ---"
          getent hosts "$FTP_HOST" || echo "WARNING: could not resolve '$FTP_HOST'"
          exit $fail

      - name: Diagnose where this FTP user lands
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<'LFTPEOF'
            set ftp:ssl-allow yes
            set ftp:ssl-force yes
            set ftp:ssl-protect-data no
            set ssl:verify-certificate no
            set ftp:passive-mode yes
            echo "### LOGIN DIRECTORY = your FTP jail root ###"
            pwd
            echo "### WHAT IS HERE ###"
            cls -l ./
            bye
          LFTPEOF

      - name: Deploy via FTPS
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          TARGET: ${{ env.REMOTE_DIR }}
        run: |
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<LFTPEOF
            set ftp:ssl-allow yes
            set ftp:ssl-force yes
            set ftp:ssl-protect-data no
            set ftp:ssl-protect-list no
            set ssl:verify-certificate no
            set ftp:passive-mode yes
            set ftp:use-allo no
            set net:timeout 30
            set net:max-retries 3
            set net:reconnect-interval-base 5
            mirror --reverse --verbose --transfer-all --parallel=1 \
              --exclude-glob .git/ \
              --exclude-glob .git* \
              --exclude-glob .github/ \
              --exclude-glob node_modules/ \
              --exclude-glob mockups/ \
              --exclude-glob '*.md' \
              ./ $TARGET
            bye
          LFTPEOF

      - name: Verify sizes are NOT zero
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          TARGET: ${{ env.REMOTE_DIR }}
        run: |
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<LFTPEOF
            set ftp:ssl-allow yes
            set ftp:ssl-force yes
            set ftp:ssl-protect-data no
            set ssl:verify-certificate no
            set ftp:passive-mode yes
            echo "### DEPLOY TARGET ###"
            cls -l $TARGET
            echo "### assets/styles ###"
            cls -l ${TARGET}assets/styles/
            echo "### assets/scripts ###"
            cls -l ${TARGET}assets/scripts/
            bye
          LFTPEOF
